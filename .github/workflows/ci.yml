name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, Typecheck, Build (/quire/), Unit & Chromium/WebKit E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Typecheck & production build (/quire/ subpath)
        env:
          VITE_BASE_PATH: /quire/
        run: npm run build

      - name: Setup Python for Playwright E2E
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (Chromium & WebKit)
        run: |
          python3 -m pip install --upgrade pip playwright
          python3 -m playwright install --with-deps chromium webkit

      - name: Run Playwright E2E validation (Chromium + WebKit @ /quire/)
        env:
          E2E_OUTPUT_DIR: ${{ runner.temp }}/quire-e2e
          E2E_BROWSER: all
          E2E_BASE_PATH: /quire/
          PLAYWRIGHT_USE_BUNDLED: '1'
        run: python3 tests/e2e_validate.py

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/quire-e2e/screenshots
          if-no-files-found: ignore
