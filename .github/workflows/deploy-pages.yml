name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify for GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build production bundle for Pages subpath
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Setup Python for Playwright E2E
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (Chromium & WebKit)
        run: |
          python3 -m pip install --upgrade pip playwright
          python3 -m playwright install --with-deps chromium webkit

      - name: Verify production Pages bundle (Chromium + WebKit E2E)
        env:
          E2E_OUTPUT_DIR: ${{ runner.temp }}/quire-e2e
          E2E_BROWSER: all
          E2E_BASE_PATH: /${{ github.event.repository.name }}/
          PLAYWRIGHT_USE_BUNDLED: '1'
        run: python3 tests/e2e_validate.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
